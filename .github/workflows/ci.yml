name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sensitive-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect sensitive paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            db:
              - 'backend/src/migrations/**'
              - 'backend/migrations/**'
              - 'backend/src/entities/**'
              - 'backend/src/modules/**/entities/**'
              - 'backend/src/data-source.ts'
            auth:
              - 'backend/src/modules/auth/**'
              - 'backend/src/common/guards/**'
              - 'backend/src/common/decorators/**'
              - 'backend/src/**/permissions/**'
              - 'backend/src/**/roles/**'

      - name: Require approvals for sensitive changes
        uses: actions/github-script@v9
        env:
          DB_CHANGED: ${{ steps.changes.outputs.db }}
          AUTH_CHANGED: ${{ steps.changes.outputs.auth }}
        with:
          script: |
            const dbChanged = process.env.DB_CHANGED === 'true';
            const authChanged = process.env.AUTH_CHANGED === 'true';

            if (!dbChanged && !authChanged) {
              core.info('No sensitive changes detected.');
              return;
            }

            // Лейблы читаем через API, а не из context.payload: payload — это
            // снимок на момент события, поэтому после навешивания лейбла
            // перезапуск джобы видел бы устаревший список и падал снова.
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const labels = currentLabels.map(label => label.name);
            const missing = [];

            if (dbChanged && !labels.includes('db-approved')) {
              missing.push('db-approved (schema/migrations)');
            }

            if (authChanged && !labels.includes('security-approved')) {
              missing.push('security-approved (auth/permissions)');
            }

            if (missing.length) {
              core.setFailed(`Sensitive changes detected. Add labels: ${missing.join(', ')}.`);
            } else {
              core.info('Required approvals present for sensitive changes.');
            }

  policy-as-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conftest (docker-compose)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            openpolicyagent/conftest:v0.56.0 \
            test -p policy/docker-compose \
            docker-compose.yml docker-compose.dev.yml

      - name: Conftest (GitHub workflows)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            openpolicyagent/conftest:v0.56.0 \
            test -p policy/github-actions \
            .github/workflows/*.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck (scripts)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/mnt \
            -w /mnt \
            koalaman/shellcheck:stable \
            --format=gcc \
            scripts/*.sh backend/scripts/*.sh infra/updater/*.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfiles)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            hadolint/hadolint \
            hadolint \
            --config .hadolint.yaml \
            Dockerfile \
            backend/Dockerfile \
            frontend/Dockerfile

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Run Trivy through its image rather than trivy-action: the action's
      # install.sh fails to fetch the binary on the runner, so the scan never
      # starts. This also matches how hadolint/shellcheck/conftest run here.
      - name: Scan repo config (Trivy)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            aquasec/trivy:0.65.0 \
            config . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs '**/node_modules' \
            --skip-dirs '**/dist' \
            --skip-dirs '**/.next' \
            --skip-dirs '**/coverage' \
            --skip-dirs '**/uploads' \
            --skip-dirs '**/.intlayer'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Backend lint (check-only)
        run: npm --prefix backend run lint:check

      - name: Frontend lint (check-only)
        run: npm --prefix frontend run lint:check

      - name: API contracts in sync
        run: |
          node scripts/sync-contracts.mjs --check
          node --test scripts/sync-contracts.test.mjs

  # Deliberately not behind `lint`. Everything downstream used to wait on it, so a
  # single misformatted line skipped typecheck, tests and build and reported one
  # failure while real type errors reached main unseen.
  typecheck:
    runs-on: ubuntu-latest
    needs: [shellcheck, hadolint, trivy-config]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Frontend typecheck
        run: npm --prefix frontend run type-check

  tests:
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow
          POSTGRES_DB: finflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finflow -d finflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # e2e boots AppModule, which now registers the statement-parsing queue.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://finflow:finflow@localhost:5432/finflow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 30d
      RESEND_API_KEY: test-api-key
      RESEND_FROM: noreply@example.com
      NODE_ENV: test
      RUN_MIGRATIONS: "true"
      CI: true
      # The secrets context is not available in `if:`, so the token is surfaced
      # as an env var the coverage-upload step's conditional can read.
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Run migrations (idempotency check)
        run: |
          npm --prefix backend run migration:run
          npm --prefix backend run migration:run

      - name: Backend tests (unit + e2e with coverage gate)
        run: npm --prefix backend run test:ci

      - name: Upload coverage to Qlty
        # !cancelled(): unit coverage is written before the e2e stage runs, so
        # upload it even when e2e fails — otherwise the badge never updates
        # while e2e is red.
        if: ${{ !cancelled() && env.QLTY_COVERAGE_TOKEN != '' }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: backend/coverage/lcov.info
          # lcov paths are relative to backend/ (src/...); map them to
          # repo-root paths so Qlty can match files
          add-prefix: backend/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [tests]
    # Secrets cannot gate a job, so the steps check the token: without one the
    # scan is skipped instead of failing every run (and with it the release).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: No SONAR_TOKEN, scan skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; SonarCloud scan skipped."

      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        # sonarcloud-github-action is archived; this is its replacement and reads
        # the same sonar-project.properties (SonarQube Cloud needs no host URL).
        uses: SonarSource/sonarqube-scan-action@v8

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Backend build
        run: npm --prefix backend run build

  dependency-scan:
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      ALLOWED_LICENSES: >-
        MIT;MIT*;MIT-0;Apache-2.0;ISC;BSD;BSD*;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;
        Python-2.0;PSF-2.0;BlueOak-1.0.0;LGPL;LGPL-2.1;LGPL-3.0;LGPL-3.0-or-later;MPL-2.0;CC0-1.0;CC-BY-4.0;WTFPL;
        (MIT OR Apache-2.0);(MIT OR CC0-1.0);(MIT OR EUPL-1.1+);(WTFPL OR MIT);(WTFPL OR ISC);
        (BSD-2-Clause OR MIT OR Apache-2.0);(MIT AND Zlib);(MIT AND BSD-3-Clause);(MIT OR GPL-3.0-or-later);
        (BSD-3-Clause OR GPL-2.0);(AFL-2.1 OR BSD-3-Clause);(Apache-2.0 AND LGPL-3.0-or-later);
        (Apache-2.0 AND LGPL-3.0-or-later AND MIT)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            website/package-lock.json

      - name: Install root deps (no scripts)
        run: npm ci --ignore-scripts

      - name: Install backend deps (no scripts)
        run: npm ci --prefix backend --ignore-scripts

      - name: Install frontend deps (no scripts)
        run: npm ci --prefix frontend --ignore-scripts

      - name: Install website deps (no scripts)
        run: npm ci --prefix website --ignore-scripts

      # --directory, not --path: audit-ci silently ignores unknown flags, and
      # `--path backend` made this step audit the repo root instead.
      - name: Backend audit (moderate and above)
        run: npx audit-ci@7.1.0 --config backend/audit-ci.json --package-manager npm --directory backend

      # audit-ci for the allowlist in frontend/audit-ci.json: findings that only
      # a major intlayer upgrade fixes, in its build-time CLI.
      - name: Frontend audit (high/critical)
        run: npx audit-ci@7.1.0 --config frontend/audit-ci.json --package-manager npm --directory frontend

      # Phase 1 of the Dependabot cleanup covers root/backend/frontend only.
      # These still carry known findings, so they report without failing
      # the build; flip continue-on-error off as each phase lands.
      - name: Root audit (high/critical)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Website audit (high/critical)
        continue-on-error: true
        run: npm audit --audit-level=high --prefix website

      - name: Root license compliance
        run: npx license-checker@25.0.1 --excludePrivatePackages --onlyAllow "$ALLOWED_LICENSES" --start .

      - name: Backend license compliance
        run: npx license-checker@25.0.1 --excludePrivatePackages --onlyAllow "$ALLOWED_LICENSES" --start backend

      - name: Frontend license compliance
        run: npx license-checker@25.0.1 --excludePrivatePackages --onlyAllow "$ALLOWED_LICENSES" --start frontend

      - name: Website license compliance
        run: npx license-checker@25.0.1 --excludePrivatePackages --onlyAllow "$ALLOWED_LICENSES" --start website

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source=. --verbose --redact

  docker:
    runs-on: ubuntu-latest
    needs: [build, dependency-scan, secrets-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: parse-ledger:ci
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: parse-ledger:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          vuln-type: "os,library"
          hide-progress: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: parse-ledger:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
