name: Makefile Targets

"on":
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  makefile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # Installs from package-lock.json (npm stays the lockfile owner); Node runs everything.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install backend deps
        working-directory: backend
        run: bun install --frozen-lockfile --network-concurrency=16

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile --network-concurrency=16

      - name: Setup bootstrap checks
        run: |
          node scripts/setup-dev.mjs --help
          node scripts/setup-dev.mjs --env-only --dry-run
          npm run test:setup-dev
          npm run setup:env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Make build
        run: make build
