name: CD

# Lumio is self-hosted: this pipeline builds, scans, signs and publishes the
# images, and stops there. Where a given instance runs is the operator's
# business, so there are no deployment environments and nothing to smoke-test
# after the fact.
"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-as-code:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Conftest (docker-compose)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            openpolicyagent/conftest:v0.56.0 \
            test -p policy/docker-compose \
            docker-compose.yml docker-compose.dev.yml

      - name: Conftest (GitHub workflows)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            openpolicyagent/conftest:v0.56.0 \
            test -p policy/github-actions \
            .github/workflows/*.yml

  build-and-publish:
    name: Build & publish hardened image
    runs-on: ubuntu-latest
    needs: policy-as-code
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      primary_tag: ${{ steps.image.outputs.primary_tag }}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for CI to succeed
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 'ci.yml';
            const timeoutMinutes = 15;
            const pollIntervalMs = 20000;
            const deadline = Date.now() + timeoutMinutes * 60 * 1000;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                head_sha: context.sha,
                per_page: 1,
              });

              const run = data.workflow_runs[0];

              if (!run) {
                core.info('No CI run found yet. Waiting...');
              } else if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info('CI is green for this commit.');
                  return;
                }
                core.setFailed(`CI run completed with conclusion: ${run.conclusion}`);
                return;
              } else {
                core.info(`CI status: ${run.status}. Waiting for completion...`);
              }

              if (Date.now() > deadline) {
                core.setFailed('Timed out waiting for CI results for this commit.');
                return;
              }

              await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
            }

      - name: Prepare image tags
        id: image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SUFFIXES="sha-${GITHUB_SHA::7}"
          PRIMARY_SUFFIX="sha-${GITHUB_SHA::7}"

          # A tagged release additionally publishes the version and `latest`;
          # a manual run publishes only the commit-sha tag.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
            SUFFIXES="${SUFFIXES} ${REF_NAME} latest"
            PRIMARY_SUFFIX="${REF_NAME}"
          fi

          # One tag list per image: the combined image (root Dockerfile) plus the
          # per-service images docker-compose.yml pulls (lumio-backend, lumio-frontend).
          emit_tags() {
            local name="$1" key="$2" suffix
            echo "${key}<<EOF" >> "$GITHUB_OUTPUT"
            for suffix in ${SUFFIXES}; do
              echo "${name}:${suffix}" >> "$GITHUB_OUTPUT"
            done
            echo "EOF" >> "$GITHUB_OUTPUT"
          }

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${IMAGE_NAME}:${PRIMARY_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "version=${PRIMARY_SUFFIX}" >> "$GITHUB_OUTPUT"
          emit_tags "${IMAGE_NAME}" tags
          emit_tags "${IMAGE_NAME}-backend" backend_tags
          emit_tags "${IMAGE_NAME}-frontend" frontend_tags

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          provenance: true

      # Per-service images consumed by docker-compose.yml (`docker compose pull`
      # starts the stack without a local build). The frontend proxies /api/v1 to
      # the backend through Next rewrites, so the API URL is baked as a relative path.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.backend_tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image.outputs.frontend_tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            API_PROXY_TARGET=http://backend:3001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.primary_tag }}
          severity: HIGH,CRITICAL
          vuln-type: "os,library"
          exit-code: 1
          hide-progress: true

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.primary_tag }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json
          upload-artifact: false

      - name: SLSA SBOM attestation
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ github.sha }}.spdx.json
          push-to-registry: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes --recursive ${{ steps.image.outputs.primary_tag }}

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign attest --yes --predicate sbom-${{ github.sha }}.spdx.json --type spdxjson ${{ steps.image.outputs.primary_tag }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ github.sha }}.spdx.json
          generate_release_notes: true
