name: CD

# Seneca is self-hosted: this pipeline builds, scans, signs and publishes the
# images, and stops there. Where a given instance runs is the operator's
# business, so there are no deployment environments and nothing to smoke-test
# after the fact.
"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-as-code:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conftest (docker-compose)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            openpolicyagent/conftest:v0.56.0 \
            test -p policy/docker-compose \
            docker-compose.yml docker-compose.dev.yml

      - name: Conftest (GitHub workflows)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            openpolicyagent/conftest:v0.56.0 \
            test -p policy/github-actions \
            .github/workflows/*.yml

  # Tags and the CI gate, once for every image and architecture below.
  prepare:
    runs-on: ubuntu-latest
    needs: policy-as-code
    permissions:
      actions: read
      contents: read
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      suffixes: ${{ steps.image.outputs.suffixes }}
      primary_tag: ${{ steps.image.outputs.primary_tag }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Wait for CI to succeed
        uses: actions/github-script@v9
        with:
          script: |
            const workflowId = 'ci.yml';
            const timeoutMinutes = 15;
            const pollIntervalMs = 20000;
            const deadline = Date.now() + timeoutMinutes * 60 * 1000;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                head_sha: context.sha,
                per_page: 1,
              });

              const run = data.workflow_runs[0];

              if (!run) {
                core.info('No CI run found yet. Waiting...');
              } else if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info('CI is green for this commit.');
                  return;
                }
                core.setFailed(`CI run completed with conclusion: ${run.conclusion}`);
                return;
              } else {
                core.info(`CI status: ${run.status}. Waiting for completion...`);
              }

              if (Date.now() > deadline) {
                core.setFailed('Timed out waiting for CI results for this commit.');
                return;
              }

              await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
            }

      - name: Prepare image tags
        id: image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SUFFIXES="sha-${GITHUB_SHA::7}"
          PRIMARY_SUFFIX="sha-${GITHUB_SHA::7}"

          # A tagged release additionally publishes the version and `latest`;
          # a manual run publishes only the commit-sha tag.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
            SUFFIXES="${SUFFIXES} ${REF_NAME} latest"
            PRIMARY_SUFFIX="${REF_NAME}"
          fi

          {
            echo "image_name=${IMAGE_NAME}"
            echo "suffixes=${SUFFIXES}"
            echo "primary_tag=${IMAGE_NAME}:${PRIMARY_SUFFIX}"
            echo "version=${PRIMARY_SUFFIX}"
          } >> "$GITHUB_OUTPUT"

  # Every image on a native runner per architecture: arm64 under QEMU took hours.
  # Each build pushes by digest; build-and-publish joins them under the tags.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        # The combined image (root Dockerfile) plus the per-service images
        # docker-compose.yml pulls (seneca-backend, seneca-frontend).
        image:
          - { name: combined, context: ., suffix: "" }
          - { name: backend, context: ./backend, suffix: -backend }
          - { name: frontend, context: ./frontend, suffix: -frontend }
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The frontend proxies /api/v1 to the backend through Next rewrites, which
      # are resolved at build time, so both the API URL and the target are baked.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,"name=${{ needs.prepare.outputs.image_name }}${{ matrix.image.suffix }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            ${{ matrix.image.name == 'backend' && format('APP_VERSION={0}', needs.prepare.outputs.version) || '' }}
            ${{ matrix.image.name == 'frontend' && 'NEXT_PUBLIC_API_URL=/api/v1' || '' }}
            ${{ matrix.image.name == 'frontend' && 'API_PROXY_TARGET=http://backend:3001' || '' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-publish:
    name: Build & publish hardened image
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      SUFFIXES: ${{ needs.prepare.outputs.suffixes }}
      PRIMARY_TAG: ${{ needs.prepare.outputs.primary_tag }}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-arch manifest per image, under every tag of this run.
      - name: Publish multi-arch manifests
        id: build
        run: |
          publish() {
            local image="$1" name="$2" suffix tags=() refs=() file
            for suffix in ${SUFFIXES}; do tags+=(-t "${name}:${suffix}"); done
            for file in "${RUNNER_TEMP}/digests/digests-${image}-"*/*; do
              refs+=("${name}@sha256:$(basename "${file}")")
            done
            [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 digests for ${image}, got ${#refs[@]}"; exit 1; }
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          }
          publish combined "${IMAGE_NAME}"
          publish backend "${IMAGE_NAME}-backend"
          publish frontend "${IMAGE_NAME}-frontend"
          digest=$(docker buildx imagetools inspect "${PRIMARY_TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PRIMARY_TAG }}
          severity: HIGH,CRITICAL
          vuln-type: "os,library"
          exit-code: 1
          hide-progress: true

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.PRIMARY_TAG }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json
          upload-artifact: false

      - name: SLSA SBOM attestation
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ github.sha }}.spdx.json
          push-to-registry: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes --recursive ${{ env.PRIMARY_TAG }}

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign attest --yes --predicate sbom-${{ github.sha }}.spdx.json --type spdxjson ${{ env.PRIMARY_TAG }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ github.sha }}.spdx.json
          generate_release_notes: true
